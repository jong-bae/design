<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디자인 시안 모음</title>
<style>
:root{--bg:#eef0f3;--ink:#16202c;--sub:#5d6b7b;--line:#cfd5dc;--accent:#0b5cad;--card:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#10151b;--ink:#e8ecf0;--sub:#8b98a6;--line:#2a333d;--accent:#6db3f2;--card:#171e26}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.6 "Pretendard","Malgun Gothic",sans-serif}
main{max-width:880px;margin:auto;padding:72px 24px}
h1{font-size:clamp(32px,6vw,52px);letter-spacing:-.03em;line-height:1.1;margin:0 0 8px}
.lead{color:var(--sub);margin:0 0 48px}
.project{display:grid;grid-template-columns:140px 1fr;gap:8px 24px;padding:24px 0;border-top:2px solid var(--ink)}
.project:last-child{border-bottom:1px solid var(--line)}
h2{margin:0;font-size:32px;letter-spacing:-.02em}
.desc{margin:0;color:var(--sub);grid-column:2}
ul{grid-column:2;list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
a{display:block;padding:8px 16px;background:var(--card);border:1px solid var(--line);color:var(--accent);text-decoration:none;font-weight:600}
a:hover{border-color:var(--accent)}
a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media(max-width:600px){.project{grid-template-columns:1fr}.desc,ul{grid-column:1}}
</style>
</head>
<body>
<main>
<h1>디자인 시안</h1>
<p class="lead">프로젝트를 선택하면 해당 시안으로 이동합니다.</p>

<section class="project">
<h2>SWS</h2>
<p class="desc">권한별 대시보드 시안 v2</p>
<ul><li><a href="sws/index.html">시안 모아보기</a></li></ul>
</section>

<section class="project">
<h2>ATS</h2>
<p class="desc">카드·칸반 보드 검토</p>
<ul>
<li><a href="ats/card-review.html">카드보드 검토</a></li>
<li><a href="ats/kanban-review.html">칸반 단계 구분 검토</a></li>
<li><a href="ats/dashboard-hr-redesign.html">대시보드 개선 - 인사담당자</a></li>
<li><a href="ats/dashboard-evaluator-redesign.html">대시보드 개선 - 평가자</a></li>
</ul>
</section>
</main>
</body>
</html>
